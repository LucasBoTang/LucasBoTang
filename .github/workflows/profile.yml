name: Refresh profile figures
on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-figures
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Fetch data and render figures
        run: python scripts/profile.py --refresh
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Commit refreshed figures
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh profile figures'
          git push
